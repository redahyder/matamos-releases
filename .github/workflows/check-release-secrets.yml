name: Check Matamos release secrets

on:
  push:
    branches:
      - ci/check-release-secrets
    paths:
      - .github/workflows/check-release-secrets.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report availability only
        env:
          MATAMOS_RELEASE_SIGNING_KEY: ${{ secrets.MATAMOS_RELEASE_SIGNING_KEY }}
          MATAMOS_SOURCE_TOKEN: ${{ secrets.MATAMOS_SOURCE_TOKEN }}
          MATAMOS_ONLINE_TOKEN: ${{ secrets.MATAMOS_ONLINE_TOKEN }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          set -euo pipefail
          for name in MATAMOS_RELEASE_SIGNING_KEY MATAMOS_SOURCE_TOKEN MATAMOS_ONLINE_TOKEN SOURCE_REPO_TOKEN RELEASE_TOKEN GH_PAT GITHUB_PAT; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
